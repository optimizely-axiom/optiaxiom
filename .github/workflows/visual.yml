name: Visual

on:
  pull_request:
    branches: [main]
    types: [labeled]
  push:
    branches: [main]

jobs:
  chromatic:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.repository_owner == 'optimizely-axiom') || (github.event_name == 'push' && github.repository_owner == 'optimizely-axiom') || github.event.label.name == 'visual' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - run: |
          pnpm install
          pnpm exec playwright install
          pnpm build
          pnpm -F @optiaxiom/storybook build:chromatic

      - uses: chromaui/action@latest
        with:
          exitZeroOnChanges: true
          # Build inputs outside src that scripts/trace-sources.mjs cannot map
          # to a dist module. A change to any of them snapshots every story.
          externals: |
            packages/*/rolldown.config.mjs
            packages/*/plugins/**
            packages/icons/icons.json
          onlyChanged: true
          projectToken: chpt_1768d7812fc589a
          storybookBuildDir: storybook-static
          workingDir: apps/storybook
