name: CI

on:
  merge_group:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  # build-base and build-head measure bundle sizes in parallel; build compares
  # them. Keep the job named `build`: it is a required check. A skipped job
  # passes a required check, so build runs after a failed dependency and fails.
  build:
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.repository_owner == 'optimizely-axiom' }}
    needs: [build-base, build-head]
    runs-on: ubuntu-latest
    steps:
      - if: ${{ needs.build-base.result != 'success' || needs.build-head.result != 'success' }}
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      # compare only reads two reports, so it needs only shared's dependencies.
      - run: pnpm install --filter @optiaxiom/shared --trust-lockfile

      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          pattern: bundle-size-*

      - run: |
          mkdir ./pr
          echo ${{ github.event.number }} > ./pr/ID
          node packages/shared/bin/bundle-size.mjs compare bundle-size-base.json --head bundle-size-head.json > ./pr/bundle-size.md

      - uses: actions/upload-artifact@v7
        with:
          name: pr-build
          path: pr/

  build-base:
    if: ${{ github.event_name == 'pull_request' && github.repository_owner == 'optimizely-axiom' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - run: pnpm install --trust-lockfile

      - run: |
          pnpm build
          pnpm --silent bundle-size > bundle-size-base.json

      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: bundle-size-base
          path: bundle-size-base.json

  build-head:
    if: ${{ github.event_name == 'pull_request' && github.repository_owner == 'optimizely-axiom' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - run: pnpm install --trust-lockfile

      - run: |
          pnpm build
          pnpm --silent bundle-size > bundle-size-head.json

      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: bundle-size-head
          path: bundle-size-head.json

  docs:
    if: ${{ github.event_name != 'push' && github.repository_owner == 'optimizely-axiom' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - run: pnpm install --trust-lockfile

      - uses: actions/cache@v6
        with:
          path: apps/docs/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/docs/**/*.mjs', 'apps/docs/**/*.mdx', 'apps/docs/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm -F docs... build

  lint:
    if: ${{ github.event_name == 'pull_request' || github.repository_owner == 'optimizely-axiom' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      # The only job that verifies the lockfile against pnpm's supply-chain
      # policies; the others pass --trust-lockfile to skip the check.
      - run: pnpm install

      - run: pnpm lint --no-fix

  # Keep the job named `test`: it is a required check. A skipped job passes a
  # required check, so test runs after a failed shard and fails.
  test:
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.repository_owner == 'optimizely-axiom') }}
    needs: test-shard
    runs-on: ubuntu-latest
    steps:
      - if: ${{ needs.test-shard.result != 'success' }}
        run: exit 1

  test-shard:
    env:
      LC_ALL: en_US.UTF-8
    if: ${{ github.event_name == 'pull_request' || github.repository_owner == 'optimizely-axiom' }}
    name: test-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version

      - run: pnpm install --trust-lockfile

      - run: pnpm exec playwright install chromium

      - run: pnpm -F icons... -F proteus... -F web-components... -F mcp... build

      - if: ${{ matrix.shard == 1 }}
        name: Check schema files are up-to-date
        run: |
          git diff --exit-code packages/proteus/src/schema/public-schema.json packages/proteus/src/schema/runtime-schema.json || {
            echo "Error: Schema files are out of date. Please run 'pnpm -F proteus build' and commit the changes."
            exit 1
          }

      - if: ${{ matrix.shard == 1 }}
        name: Check package exports are up-to-date
        run: |
          git diff --exit-code packages/icons packages/react/package.json && test -z "$(git status --porcelain packages/icons)" || {
            echo "Error: generated icon files or package exports are out of date. Please run 'pnpm -F icons -F react build' and commit the changes, including new files under packages/icons."
            exit 1
          }

      - if: ${{ matrix.shard == 1 }}
        name: Check MCP data is up-to-date
        run: |
          git diff --exit-code packages/mcp/src/data.json || {
            echo "Error: MCP data is out of date. Please run 'pnpm -F mcp build', commit the changes, and add an @optiaxiom/mcp changeset."
            exit 1
          }

      - if: ${{ github.event_name == 'push' }}
        run: pnpm exec vitest run '--project=!storybook' --shard=${{ matrix.shard }}/2

      - if: ${{ github.event_name != 'push' }}
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/2
        timeout-minutes: 3
