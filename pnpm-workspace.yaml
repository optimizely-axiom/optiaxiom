packages:
  - apps/*
  - packages/*
  # DataTable demos for TanStack Table v9-only features; the docs app is on v8.
  - apps/docs/demos/data-table/highlighted-row-usage
  - apps/docs/demos/data-table/row-intent-usage

allowBuilds:
  edgedriver: true
  esbuild: true
  geckodriver: true
  msw: true
  sharp: true

overrides:
  "@module-federation/enhanced": "^2.7.0"

patchedDependencies:
  "@dnd-kit/react": patches/@dnd-kit__react.patch
  "@ui-sdk/core": patches/@ui-sdk__core.patch
  "@ui-sdk/react": patches/@ui-sdk__react.patch
  "@vanilla-extract/sprinkles": patches/@vanilla-extract__sprinkles.patch
  nextra-theme-docs: patches/nextra-theme-docs.patch
  react-docgen-typescript: patches/react-docgen-typescript.patch
  rolldown-plugin-dts: patches/rolldown-plugin-dts.patch
